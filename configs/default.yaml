# Default configuration for gene prediction model training

# Model configuration
model:
  vocab_size: 5  # A, C, G, T, N
  d_model: 512
  n_layers: 6
  n_heads: 8
  max_seq_length: 8192
  dropout: 0.1

# Loss function weights
loss:
  gene_weight: 1.0
  exon_weight: 1.0
  splice_weight: 1.0
  coding_weight: 0.5
  constraint_weight: 0.1

# Training configuration
training:
  batch_size: 8
  max_epochs: 100
  learning_rate: 1e-4
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 10
  accumulate_grad_batches: 1
  num_workers: 4
  checkpoint_dir: "models/checkpoints"

# Data configuration
data:
  sequences_path: "data/sequences.fasta"
  annotations_path: "data/annotations.gff"
  max_sequence_length: 8192
  window_size: 1024
  stride: 512

# Logging configuration
logging:
  use_wandb: false
  project_name: "gene-prediction"
  run_name: "transformer-gene-predictor"
  log_every_n_steps: 10
  val_check_interval: 0.25

# Hardware configuration
hardware:
  accelerator: "auto"  # auto, cpu, gpu, tpu
  devices: "auto"      # auto, 1, 2, etc.
  precision: 16        # 16, 32, 64

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
