# Gene Prediction Model Configuration with Capped Class Weights
# Focused on gene boundary detection: INTERGENIC, UTR5, START, GENE_BODY, STOP, UTR3

# Model architecture - slightly larger for better capacity
model:
  vocab_size: 5              # A, C, G, T, N
  d_model: 256               # Increased model size for better learning
  n_layers: 4                # More layers for better representation
  n_heads: 8                 # More attention heads
  dropout: 0.1               # Dropout rate
  max_seq_length: 2500       # Sequence length for training

# Training configuration
training:
  max_epochs: 10             # More epochs for proper learning
  batch_size: 4              # Reasonable batch size
  accumulate_grad_batches: 1 # No gradient accumulation
  learning_rate: 5e-4        # Lower learning rate for stability
  weight_decay: 0.01         # Weight decay for regularization
  early_stopping_patience: 5 # Patience for early stopping
  precision: 32              # Training precision

# Loss configuration - NEW SECTION
loss:
  weight_strategy: "capped"  # Options: "capped", "sqrt", "uncapped"
  max_weight_ratio: 50.0     # Cap weights to max 50x difference
  use_focal_loss: false      # Use weighted cross-entropy
  focal_alpha: 1.0           # Alpha for focal loss (if enabled)
  focal_gamma: 2.0           # Gamma for focal loss (if enabled)

# Data configuration
data:
  num_workers: 0             # Number of data loading workers (0 for debugging)
  
# Hardware configuration
hardware:
  accelerator: "cpu"         # Use CPU for testing
  devices: 1                 # Number of devices

# Logging configuration
logging:
  use_wandb: false           # Disable wandb for testing
  log_dir: "logs"            # Local logging directory

# Model output configuration
output:
  num_gene_boundary_classes: 6  # INTERGENIC, UTR5, START, GENE_BODY, STOP, UTR3
