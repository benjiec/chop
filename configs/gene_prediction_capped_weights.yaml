# Gene prediction with boundary pattern weights - emphasizes complete UTR+START/STOP patterns
# Based on class distribution: START/STOP (0.08% each), UTR5 (7.39%), UTR3 (9.82%), GENE_BODY (19.15%), INTERGENIC (63.49%)

model:
  max_seq_length: 2500
  d_model: 256
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  vocab_size: 5  # A, T, G, C, N

training:
  batch_size: 4
  learning_rate: 5e-4
  max_epochs: 10
  weight_decay: 0.01
  early_stopping_patience: 5

# Hardware acceleration
hardware:
  accelerator: "auto"  # Use MPS on Apple Silicon, CUDA on NVIDIA, CPU fallback

# Loss configuration with boundary pattern emphasis (moderate weights)
loss:
  weight_strategy: "custom"
  custom_weights:
    INTERGENIC: 1.0      # Base weight (63.49% of data)
    GENE_BODY: 3.0       # Modest boost (19.15% of data)
    UTR5: 20.0           # Moderate - signals START quality (7.39% of data, contains Kozak)
    UTR3: 15.0           # Moderate - signals STOP quality (9.82% of data, contains poly-A)
    START: 20.0          # Moderate - critical boundary (0.08% of data)
    STOP: 20.0           # Moderate - critical boundary (0.08% of data)

# Data configuration
data:
  window_size: 2048
  stride: 1024
  min_gene_length: 100
  
# UTR regions (relative to gene boundaries)
utrs:
  utr5_size: 500
  utr3_size: 500

# Debug configuration
debug:
  save_targets: true