# Gene Prediction Model Configuration with Very Conservative Weights
# Much smaller weight ratios to prevent any training instability

# Model architecture 
model:
  vocab_size: 5              # A, C, G, T, N
  d_model: 256               # Model size
  n_layers: 4                # Layers
  n_heads: 8                 # Attention heads
  dropout: 0.1               # Dropout rate
  max_seq_length: 2500       # Sequence length

# Training configuration
training:
  max_epochs: 15             # More epochs to compensate for gentler learning
  batch_size: 4              # Batch size
  accumulate_grad_batches: 1 # No gradient accumulation
  learning_rate: 1e-4        # Much lower learning rate
  weight_decay: 0.01         # Weight decay
  early_stopping_patience: 8 # More patience
  precision: 32              # Training precision

# Loss configuration - Very conservative weighting
loss:
  weight_strategy: "capped"  # Capped weights
  max_weight_ratio: 10.0     # Much smaller max ratio (10x instead of 50x)
  use_focal_loss: false      # Weighted cross-entropy
  focal_alpha: 1.0           
  focal_gamma: 2.0           

# Data configuration
data:
  num_workers: 0             
  
# Hardware configuration
hardware:
  accelerator: "auto"        # Use auto detection (will use MPS on Apple Silicon)
  devices: 1                 

# Logging configuration
logging:
  use_wandb: false           
  log_dir: "logs"            

# Model output configuration
output:
  num_gene_boundary_classes: 6

# Debug configuration
debug:
  save_targets: true           # Save training targets for validation and debugging
