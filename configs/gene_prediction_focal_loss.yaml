# Gene prediction with focal loss + boundary pattern weights
# Combines focal loss (gamma=3.0) with class weights to maximize START/STOP detection

model:
  sequence_length: 2048
  d_model: 256
  num_heads: 8
  num_layers: 6
  dropout: 0.1
  vocab_size: 5  # A, T, G, C, N

training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 15
  weight_decay: 0.01
  warmup_steps: 500

# Hardware acceleration
hardware:
  accelerator: "auto"  # Use MPS on Apple Silicon, CUDA on NVIDIA, CPU fallback

# Loss configuration with focal loss + weights
loss:
  use_focal_loss: true
  focal_gamma: 3.0           # Higher gamma = more focus on hard examples
  focal_alpha: [1.0, 3.0, 80.0, 50.0, 300.0, 300.0]  # Per-class weights [INTERGENIC, GENE_BODY, UTR5, UTR3, START, STOP]
  
# Alternative: if focal_alpha causes issues, fall back to weight_strategy
# loss:
#   use_focal_loss: true
#   focal_gamma: 3.0
#   weight_strategy: "custom"
#   custom_weights:
#     INTERGENIC: 1.0
#     GENE_BODY: 3.0
#     UTR5: 80.0
#     UTR3: 50.0
#     START: 300.0
#     STOP: 300.0

# Data configuration
data:
  window_size: 2048
  stride: 1024
  min_gene_length: 100
  
# UTR regions (relative to gene boundaries)
utrs:
  utr5_size: 500
  utr3_size: 500

# Debug configuration
debug:
  save_targets: true