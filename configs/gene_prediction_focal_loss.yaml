# Gene prediction with focal loss + boundary pattern weights
# Combines focal loss (gamma=3.0) with class weights to maximize START/STOP detection

model:
  max_seq_length: 2500
  d_model: 256
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  vocab_size: 5  # A, T, G, C, N

training:
  batch_size: 4
  learning_rate: 5e-4
  max_epochs: 10
  weight_decay: 0.01
  early_stopping_patience: 5

# Hardware acceleration
hardware:
  accelerator: "auto"  # Use MPS on Apple Silicon, CUDA on NVIDIA, CPU fallback

# Loss configuration with MODERATE focal loss + weights
# Reduces aggressiveness to prevent model from predicting START everywhere
loss:
  use_focal_loss: true
  focal_gamma: 2.0           # Reduced from 3.0 - less aggressive focusing
  focal_alpha: 1.0           # Scalar multiplier (1.0 = use custom_weights directly)
  weight_strategy: "custom"
  custom_weights:
    INTERGENIC: 1.0          # Low weight - easy to classify
    GENE_BODY: 3.0           # Moderate weight
    UTR5: 50.0               # Reduced from 80.0 - still important for START context
    UTR3: 30.0               # Reduced from 50.0 - still important for STOP context  
    START: 100.0             # Reduced from 300.0 - important but not panic-inducing
    STOP: 100.0              # Reduced from 300.0 - important but not panic-inducing

# Data configuration
data:
  window_size: 2048
  stride: 1024
  min_gene_length: 100
  
# UTR regions (relative to gene boundaries)
utrs:
  utr5_size: 500
  utr3_size: 500

# Debug configuration
debug:
  save_targets: true