# Gene prediction with focal loss + boundary pattern weights
# Combines focal loss (gamma=3.0) with class weights to maximize START/STOP detection

model:
  max_seq_length: 2500
  d_model: 256
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  vocab_size: 5  # A, T, G, C, N

training:
  batch_size: 4
  learning_rate: 5e-4
  max_epochs: 10
  weight_decay: 0.01
  early_stopping_patience: 5

# Hardware acceleration
hardware:
  accelerator: "auto"  # Use MPS on Apple Silicon, CUDA on NVIDIA, CPU fallback

# Loss configuration with focal loss + weights
# The focal loss will use custom_weights as per-class alpha values
loss:
  use_focal_loss: true
  focal_gamma: 3.0
  focal_alpha: 1.0           # Scalar multiplier (1.0 = use custom_weights directly)
  weight_strategy: "custom"
  custom_weights:
    INTERGENIC: 1.0          # Low weight - easy to classify
    GENE_BODY: 3.0           # Moderate weight
    UTR5: 80.0               # High weight - important for START context
    UTR3: 50.0               # High weight - important for STOP context  
    START: 300.0             # Very high weight - critical boundary
    STOP: 300.0              # Very high weight - critical boundary

# Data configuration
data:
  window_size: 2048
  stride: 1024
  min_gene_length: 100
  
# UTR regions (relative to gene boundaries)
utrs:
  utr5_size: 500
  utr3_size: 500

# Debug configuration
debug:
  save_targets: true