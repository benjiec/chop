# Gene Prediction Model Configuration
# Focused on gene boundary detection: INTERGENIC, UTR5, START, GENE_BODY, STOP, UTR3

# Model architecture
model:
  vocab_size: 5              # A, C, G, T, N
  d_model: 120               # Must be divisible by n_heads (120 ÷ 4 = 30)
  n_layers: 3                # Fewer layers for testing
  n_heads: 4                 # 4 heads work with d_model=120
  dropout: 0.1               # Dropout rate
  max_seq_length: 2500       # Further reduced sequence length for faster testing

# Training configuration
training:
  max_epochs: 2              # Fewer epochs for faster testing
  batch_size: 2              # Smaller batch size
  accumulate_grad_batches: 1 # No gradient accumulation
  learning_rate: 1e-3        # Higher learning rate for faster convergence
  weight_decay: 0.01         # Weight decay for regularization
  early_stopping_patience: 2 # Short patience
  precision: 32              # Training precision

# Data configuration
data:
  num_workers: 0             # Number of data loading workers (0 for debugging)
  
# Hardware configuration
hardware:
  accelerator: "auto"        # Use auto detection (will use MPS on Apple Silicon)
  devices: 1                 # Number of devices

# Logging configuration
logging:
  use_wandb: false           # Disable wandb for testing
  log_dir: "logs"            # Local logging directory

# Model output configuration
output:
  num_gene_boundary_classes: 6  # INTERGENIC, UTR5, START, GENE_BODY, STOP, UTR3

# Debug configuration
debug:
  save_targets: true           # Save training targets for validation and debugging
