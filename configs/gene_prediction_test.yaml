# Original gene prediction config with extreme weights (for comparison)
# This represents the original approach before fixes

model:
  max_seq_length: 2500
  d_model: 256
  n_heads: 4
  n_layers: 4
  dropout: 0.1
  vocab_size: 5  # A, T, G, C, N

training:
  batch_size: 4
  learning_rate: 5e-4
  max_epochs: 10
  weight_decay: 0.01
  early_stopping_patience: 5

# Hardware acceleration
hardware:
  accelerator: "auto"  # Use MPS on Apple Silicon, CUDA on NVIDIA, CPU fallback

# Loss configuration with original extreme weights
loss:
  weight_strategy: "uncapped"  # Original extreme approach

# Data configuration
data:
  window_size: 2048
  stride: 1024
  min_gene_length: 100
  
# UTR regions (relative to gene boundaries)
utrs:
  utr5_size: 500
  utr3_size: 500

# Debug configuration
debug:
  save_targets: true