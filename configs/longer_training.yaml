# Configuration for longer training

# Model configuration - same as conservative
model:
  vocab_size: 5  # A, C, G, T, N
  d_model: 128   # Small model
  n_layers: 3    # Fewer layers
  n_heads: 4     # Fewer heads
  max_seq_length: 1024  # 1kb windows
  dropout: 0.1

# Loss function weights
loss:
  gene_weight: 1.0
  exon_weight: 1.5      # Higher weight for exons
  splice_weight: 2.0    # Higher weight for splice sites
  coding_weight: 1.0
  constraint_weight: 0.1

# Training configuration - LONGER TRAINING
training:
  batch_size: 1         # Single sequence at a time
  max_epochs: 20        # Much longer training (was 5)
  learning_rate: 5e-5   # Lower learning rate for stability
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 10          # More patience before early stopping
  accumulate_grad_batches: 8  # Effective batch size = 1*8 = 8
  num_workers: 1
  checkpoint_dir: "models/checkpoints"

# Data configuration - same windowing
data:
  sequences_path: "data/GCA_001939145.1.fna"
  annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20.gff"
  max_sequence_length: 1024    # 1kb windows
  window_size: 1024           # Match max_sequence_length  
  stride: 512                 # 50% overlap

# Logging configuration
logging:
  use_wandb: false
  project_name: "gene-prediction"
  run_name: "longer-training"
  log_every_n_steps: 100
  val_check_interval: 0.5     # Check validation more frequently

# Hardware configuration
hardware:
  accelerator: "cpu"
  devices: 1
  precision: 32

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
