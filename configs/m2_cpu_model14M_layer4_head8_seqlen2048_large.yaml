# Configuration for M2 native training - CPU ONLY (no MPS issues)

# Model configuration - optimized for M2 CPU
model:
  vocab_size: 5  # A, C, G, T, N
  d_model: 256   # Larger model (M2 has more memory)
  n_layers: 4    # More layers
  n_heads: 8     # More heads
  max_seq_length: 2048  # Longer sequences
  dropout: 0.1

# Loss function weights
loss:
  gene_weight: 1.0
  exon_weight: 1.5      # Higher weight for exons
  splice_weight: 2.0    # Higher weight for splice sites
  coding_weight: 1.0
  constraint_weight: 0.1

# Training configuration - M2 CPU optimized
training:
  batch_size: 4         # Larger batch size
  max_epochs: 20        # More epochs
  learning_rate: 1e-4   # Standard learning rate
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 10          # More patience
  accumulate_grad_batches: 2  # Effective batch size = 8
  num_workers: 0        # Single-threaded to avoid multiprocessing issues
  checkpoint_dir: "models/checkpoints"

# Data configuration
data:
  sequences_path: "data/GCA_001939145.1.fna"
  annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20.gff"
  max_sequence_length: 2048    # 2kb windows
  window_size: 2048           # Match max_sequence_length  
  stride: 1024                # 50% overlap

# Logging configuration
logging:
  use_wandb: false
  project_name: "gene-prediction"
  run_name: "m2-cpu-only"
  log_every_n_steps: 50
  val_check_interval: 0.25

# Hardware configuration - FORCE CPU ONLY
hardware:
  accelerator: "cpu"    # Explicitly CPU only
  devices: 1            # Single device
  precision: 32         # Full precision

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
