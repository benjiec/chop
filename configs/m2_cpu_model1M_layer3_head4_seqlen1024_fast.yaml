# Fast M2 configuration - smaller model for speed

# Model configuration - smaller for speed
model:
  vocab_size: 5  # A, C, G, T, N
  d_model: 128   # Same as Docker (was 256)
  n_layers: 3    # Same as Docker (was 4)
  n_heads: 4     # Same as Docker (was 8)
  max_seq_length: 1024  # Same as Docker (was 2048)
  dropout: 0.1

# Loss function weights
loss:
  gene_weight: 1.0
  exon_weight: 1.5
  splice_weight: 2.0
  coding_weight: 1.0
  constraint_weight: 0.1

# Training configuration - optimized for speed
training:
  batch_size: 2         # Smaller batch (was 4)
  max_epochs: 20        
  learning_rate: 1e-4   
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 10          
  accumulate_grad_batches: 4  # Effective batch size = 8
  num_workers: 0        # Single-threaded to avoid multiprocessing issues
  checkpoint_dir: "models/checkpoints"

# Data configuration - same as Docker
data:
  sequences_path: "data/GCA_001939145.1.fna"
  annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20.gff"
  max_sequence_length: 1024    # Same as Docker
  window_size: 1024           
  stride: 512                 

# Logging configuration
logging:
  use_wandb: false
  project_name: "gene-prediction"
  run_name: "m2-fast"
  log_every_n_steps: 50
  val_check_interval: 0.25

# Hardware configuration
hardware:
  accelerator: "cpu"    
  devices: 1            
  precision: 32         

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
