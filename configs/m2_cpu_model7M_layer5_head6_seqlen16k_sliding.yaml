# M2 config optimized for long genes with sliding window approach
# Based on analysis showing 89% of genes fit within 32kb (2 overlapping 16k windows)

model:
  vocab_size: 5
  d_model: 256          # Increased from 128 for richer representations
  n_layers: 5           # Increased from 3 for longer-range dependencies  
  n_heads: 6            # Increased from 4 for more attention diversity
  max_seq_length: 16384 # 8x increase from 2048 to capture 74% of genes completely
  dropout: 0.1

loss:
  gene_weight: 1.0
  exon_weight: 1.5      # Emphasize exon detection
  splice_weight: 2.0    # Keep high weight for splice sites
  coding_weight: 1.0
  constraint_weight: 0.1

training:
  batch_size: 1         # Keep small due to 8x longer sequences
  max_epochs: 25        # Increase epochs for more complex model
  learning_rate: 5e-5   # Reduce LR for larger model stability
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 15          # Increase patience for larger model
  accumulate_grad_batches: 16  # Increase to maintain effective batch size
  num_workers: 0
  checkpoint_dir: "models/checkpoints"

data:
  sequences_path: "data/GCA_001939145.1.fna"
  annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20.gff"
  max_sequence_length: 16384    # Match model max_seq_length
  window_size: 16384            # 16k windows
  stride: 8192                  # 8k stride = 50% overlap for seamless reconstruction
  use_sliding_windows: true     # Enable sliding window processing
  min_gene_coverage: 0.5        # Minimum fraction of gene that must be in window for training

# Sliding window inference settings
inference:
  enable_sliding_windows: true
  window_size: 16384
  stride: 8192
  overlap_threshold: 0.5        # Minimum overlap to merge predictions
  consensus_method: "weighted"  # Options: "average", "weighted", "confidence"
  boundary_smoothing: true      # Smooth predictions at window boundaries
  gene_reconstruction: true     # Enable multi-window gene reconstruction
  max_reconstruction_windows: 8 # Max windows to use for single gene (covers 128kb)

# Post-processing settings
postprocessing:
  enable: true
  min_gene_length: 300          # Minimum gene length to consider (bp)
  min_exon_length: 9            # Minimum exon length (3 bp = 1 codon)
  max_intron_length: 50000      # Maximum reasonable intron length
  gene_boundary_smoothing: 5    # Smooth gene boundaries over N positions
  remove_isolated_predictions: true  # Remove single-position predictions
  enforce_gene_structure: true  # Ensure genes have start/end boundaries
  splice_site_validation: true  # Validate splice sites have proper motifs

logging:
  use_wandb: false
  project_name: "gene-prediction-16k"
  run_name: "m2-sliding-16k"
  log_every_n_steps: 25         # Reduce logging frequency
  val_check_interval: 0.25

hardware:
  accelerator: "cpu"    
  devices: 1            
  precision: 32         

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
  evaluate_gene_reconstruction: true  # Evaluate full gene reconstruction quality
  evaluate_sliding_windows: true      # Test sliding window performance

# Memory optimization settings
optimization:
  gradient_checkpointing: true   # Save memory during training
  mixed_precision: false         # Keep disabled for CPU
  dataloader_pin_memory: false   # Disable for CPU training
  empty_cache_frequency: 100     # Clear cache every N steps

# Species-specific motif discovery (future enhancement)
motif_discovery:
  enable: false                  # Disable for now, implement later
  derive_from_annotations: true  # Learn motifs from training data
  min_motif_frequency: 10        # Minimum occurrences to consider motif
  motif_context_length: 10       # Bases around splice sites to analyze
