# Fast development config with MPS acceleration for quick iteration and testing
# Optimized for speed while maintaining biological pattern recognition

model:
  vocab_size: 5
  d_model: 190          # Rich representations for complex biological patterns (divisible by 5 heads)
  n_layers: 3           # Reduced layers for faster training while preserving key biological hierarchy
  n_heads: 5            # Essential biological diversity: splice sites, codons, boundaries
  max_seq_length: 4096
  dropout: 0.1

loss:
  gene_weight: 1.0
  exon_weight: 1.5      # Emphasize exon detection for complex multi-exon genes
  splice_weight: 0.0    # REMOVED - let model discover splice patterns from exon/intron boundaries
  coding_weight: 1.0
  constraint_weight: 0.1

training:
  batch_size: 1         # Conservative batch size for MPS memory limits
  max_epochs: 30        # More epochs for complex architecture
  learning_rate: 1e-4   # Scaled appropriately for effective batch size of 32
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 15          # Allow longer convergence time
  accumulate_grad_batches: 16  # Effective batch size of 32 for stable gradients
  num_workers: 4        # Parallel data loading for faster throughput
  checkpoint_dir: "models/checkpoints"

data:
  sequences_path: "data/GCA_001939145.1.fna"
  tsv_annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20_annotations.tsv"  # Standard format
  max_sequence_length: 4096     # Match model max_seq_length  
  window_size: 4096             # 4k windows for MPS memory efficiency
  stride: 2048                  # 50% overlap for seamless reconstruction
  use_sliding_windows: true     # Enable sliding window processing
  min_gene_coverage: 0.5        # Minimum fraction of gene in window for training
  use_cache: true              # Enable caching for faster loading
  cache_dir: "cache"           # Cache directory
  pin_memory: false            # Not supported on MPS yet
  augmentation:                # Data augmentation settings
    enable: false              # Disabled for development speed
    reverse_complement_prob: 0.5  # Probability of reverse complement
    masking_prob: 0.1          # Probability of random masking
    max_mask_length: 50        # Maximum length of masked regions

# Sliding window inference settings
inference:
  enable_sliding_windows: true
  window_size: 4096
  stride: 2048
  overlap_threshold: 0.5        # Minimum overlap to merge predictions
  consensus_method: "weighted"  # Weight by prediction confidence
  boundary_smoothing: true      # Smooth predictions at window boundaries
  gene_reconstruction: true     # Enable multi-window gene reconstruction
  max_reconstruction_windows: 6 # Handle genes up to 48kb (6 * 8k)

# Post-processing settings for biological validation
postprocessing:
  enable: true
  min_gene_length: 300          # Minimum biologically reasonable gene (100 codons)
  min_exon_length: 9            # Minimum exon (3 codons)
  max_intron_length: 50000      # Maximum reasonable intron for algae
  gene_boundary_smoothing: 5    # Smooth boundaries over 5bp window
  remove_isolated_predictions: true  # Remove single-position artifacts
  enforce_gene_structure: true  # Ensure genes have proper start/end
  splice_site_validation: false # Disabled - let model learn species-specific motifs

logging:
  use_wandb: false
  project_name: "gene-prediction-algae-dev-mps"
  run_name: "fast-dev-mps-3layer-8k"
  log_every_n_steps: 100     # Balanced frequency for monitoring without overhead
  val_check_interval: 1.0    # Validate once per epoch for efficiency

hardware:
  accelerator: "mps"     # Use Metal Performance Shaders for Apple Silicon
  devices: 1            
  precision: 32          # MPS supports 32-bit precision

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
  evaluate_gene_reconstruction: true  # Test multi-window gene assembly
  evaluate_sliding_windows: true      # Validate sliding window performance

# Memory optimization for 24GB RAM system with MPS
optimization:
  gradient_checkpointing: false  # Disable for maximum speed in development
  mixed_precision: false         # Not yet stable on MPS
  dataloader_pin_memory: true    # Enable for MPS GPU transfers
  empty_cache_frequency: 100     # Clear cache less frequently for speed
  max_memory_usage_gb: 14        # Conservative for MPS shared memory with dev workload

# Species-specific motif discovery (future enhancement)
motif_discovery:
  enable: false                  # TODO: Implement in future version
  derive_from_annotations: true  # Learn from actual algae splice sites
  min_motif_frequency: 10        # Minimum occurrences to consider valid
  motif_context_length: 10       # Analyze 10bp around splice sites
  
# Target configuration (cleaned up based on analysis)
targets:
  include_splice_sites: false    # REMOVED - too interpretive, let model discover
  gene_boundaries: true          # Direct observations from annotations
  exon_intron: true             # Direct observations (with intron bug fix applied)
  coding_potential: true        # Direct observations from CDS regions

# Model capacity analysis for MPS development
# Estimated parameters: ~3.5M (d_model=252, n_layers=3, n_heads=6)
# Estimated memory usage: ~8-10 GB on MPS (very efficient)
# Gene coverage: ~55% single window, ~75% sliding window (up to 16kb genes)
# Expected speedup: 20-100x faster than CPU, optimized for rapid development iteration
