# Minimal configuration for testing without annotations

# Model configuration - small model for testing
model:
  vocab_size: 5  # A, C, G, T, N
  d_model: 128   # Small for testing
  n_layers: 2    # Small for testing
  n_heads: 4     # Small for testing
  max_seq_length: 1024  # Small for testing
  dropout: 0.1

# Loss function weights
loss:
  gene_weight: 1.0
  exon_weight: 1.0
  splice_weight: 1.0
  coding_weight: 0.5
  constraint_weight: 0.1

# Training configuration - minimal settings
training:
  batch_size: 2    # Small batch size
  max_epochs: 2    # Just for testing
  learning_rate: 1e-4
  weight_decay: 0.01
  gradient_clip_val: 1.0
  patience: 3
  accumulate_grad_batches: 1
  num_workers: 1
  checkpoint_dir: "models/checkpoints"

# Data configuration - no annotations for now
data:
  sequences_path: "data/GCA_001939145.1.fna"
  # annotations_path: "data/GCA_001939145.1_filtered_tcov0.99_evalue1e-20.gff"  # Commented out
  max_sequence_length: 1024
  window_size: 512
  stride: 256

# Logging configuration
logging:
  use_wandb: false
  project_name: "gene-prediction"
  run_name: "transformer-gene-predictor-minimal"
  log_every_n_steps: 10
  val_check_interval: 0.25

# Hardware configuration
hardware:
  accelerator: "cpu"
  devices: 1
  precision: 32

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  save_predictions: true
  output_dir: "results"
